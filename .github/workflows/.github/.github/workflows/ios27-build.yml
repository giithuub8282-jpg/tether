name: iOS 27 Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    name: Build unsigned IPA with iOS 27 SDK
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          app=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort | tail -1)
          test -n "$app" || { echo "Xcode 27 not found:"; ls /Applications | grep -i xcode; exit 1; }
          sudo xcode-select -s "$app/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --quiet

      - name: Build unsigned iOS app
        working-directory: ios
        run: |
          xcodebuild -project Tether.xcodeproj -scheme Tether -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build-ios27 \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO build -quiet

      - name: Package unsigned IPA
        run: |
          app=$(find ios/build-ios27/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$app"
          mkdir -p work/Payload dist
          cp -R "$app" work/Payload/
          (cd work && zip -qry "../dist/Tether-ios27-unsigned.ipa" Payload)

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tether-ios27-unsigned-IPA
          path: dist/Tether-ios27-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
