
name: Build Tether IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate

      - name: Build iOS
        run: |
          xcodebuild \
            -project ios/Tether.xcodeproj \
            -scheme Tether \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -skipMacroValidation \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Tether.app Payload/
          zip -r Tether.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Tether-IPA
          path: Tether.ipa
